name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 注意：secrets 上下文不可用于 job 级 if，因此改为在步骤内判断
  # 未配置 CODEBUDDY_API_KEY 时自动跳过，不会阻塞后面的构建与部署
  release-notes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检查是否启用 AI 发布说明
        id: enable
        env:
          CODEBUDDY_API_KEY: ${{ secrets.CODEBUDDY_API_KEY }}
        run: |
          if [ -n "$CODEBUDDY_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "未配置 CODEBUDDY_API_KEY，跳过生成发布说明。"
          fi

      - uses: actions/checkout@v4
        if: steps.enable.outputs.enabled == 'true'
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        if: steps.enable.outputs.enabled == 'true'
        with:
          node-version: '20'

      - name: 安装 CodeBuddy CLI
        if: steps.enable.outputs.enabled == 'true'
        run: npm install -g @tencent-ai/codebuddy-code

      - name: 生成发布说明
        if: steps.enable.outputs.enabled == 'true'
        env:
          CODEBUDDY_API_KEY: ${{ secrets.CODEBUDDY_API_KEY }}
          CODEBUDDY_INTERNET_ENVIRONMENT: ${{ vars.CODEBUDDY_INTERNET_ENVIRONMENT }}
          CODEBUDDY_RETRY_WATCHDOG: '1'
          CODEBUDDY_CODE_MAX_TURNS: '15'
        run: |
          set -o pipefail
          git log --no-merges -20 --pretty=format:'%h %s' > commits.txt
          cat commits.txt | codebuddy -p \
            "根据以下提交记录，用简体中文生成简洁的发布说明（Markdown）。按「新功能 / 修复 / 其他」分组，每条一行，不要编造未提及的内容。" \
            --dangerously-skip-permissions \
            --allowedTools "Read Grep Glob Bash(git:*)" \
            > release-notes.md
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 运行测试
        run: npm test

      - name: 构建
        run: npm run build

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
