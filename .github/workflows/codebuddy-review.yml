name: CodeBuddy Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    # 注意：secrets 上下文不可用于 job 级 if，因此改为在步骤内判断
    # 未配置 CODEBUDDY_API_KEY 时自动跳过，避免 fork PR / 未授权场景直接失败
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_REF: ${{ github.base_ref || 'main' }}
    steps:
      - name: 检查是否启用 AI 审查
        id: enable
        env:
          CODEBUDDY_API_KEY: ${{ secrets.CODEBUDDY_API_KEY }}
        run: |
          if [ -n "$CODEBUDDY_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "未配置 CODEBUDDY_API_KEY，跳过 AI 代码审查。"
          fi

      - uses: actions/checkout@v4
        if: steps.enable.outputs.enabled == 'true'
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        if: steps.enable.outputs.enabled == 'true'
        with:
          node-version: '20'

      - name: 安装 CodeBuddy CLI
        if: steps.enable.outputs.enabled == 'true'
        run: npm install -g @tencent-ai/codebuddy-code

      - name: 生成 PR diff
        id: diff
        if: steps.enable.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            # 用 gh 直接从 API 取 diff，最可靠（不受浅克隆/远程追踪引用影响）
            gh pr diff "$PR_NUMBER" > pr.diff
          else
            # workflow_dispatch 手动触发时没有 PR 上下文，退回与默认分支比较
            git fetch origin "$BASE_REF" --depth=1
            git diff --unified=5 "FETCH_HEAD...HEAD" > pr.diff
          fi
          wc -l pr.diff
          if [ ! -s pr.diff ]; then
            echo "::warning::本次未取到任何 diff，跳过审查（PR 可能已合入或内容为空）。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: AI 代码审查
        if: steps.enable.outputs.enabled == 'true' && steps.diff.outputs.skip != 'true'
        env:
          CODEBUDDY_API_KEY: ${{ secrets.CODEBUDDY_API_KEY }}
          # 中国版填 internal；海外版留空；iOA 版填 ioa
          CODEBUDDY_INTERNET_ENVIRONMENT: ${{ vars.CODEBUDDY_INTERNET_ENVIRONMENT }}
          CODEBUDDY_RETRY_WATCHDOG: '1'
          CODEBUDDY_CODE_MAX_TURNS: '20'
        run: |
          set -o pipefail
          codebuddy --version || true
          PROMPT="$(cat .github/codebuddy/review-prompt.md)"
          set +e
          cat pr.diff | codebuddy -p "$PROMPT" \
            --dangerously-skip-permissions \
            --allowedTools "Read Grep Glob Bash(git:*)" \
            > review.md 2>review.err
          EXIT=$?
          set -e
          echo "exit code: $EXIT"
          echo "--- CLI stderr（仅诊断用，不作为审查结果）---"
          # 去掉 ANSI 颜色后输出，日志里更易读
          sed -r 's/\x1B\[[0-9;]*[mK]//g' review.err || true
          echo "--- review.md bytes: $(wc -c < review.md) ---"
          if [ ! -s review.md ]; then
            echo "CodeBuddy 未返回审查内容，请检查上面对应的密钥与环境配置。"
            exit 1
          fi
          cat review.md

      - name: 写入 Job Summary
        if: always()
        run: |
          {
            echo '## CodeBuddy AI 代码审查'
            echo
            cat review.md 2>/dev/null || echo '未生成审查结果。'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 回写 PR 评论
        if: github.event_name == 'pull_request' && steps.enable.outputs.enabled == 'true' && steps.diff.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ ! -s review.md ]; then
            echo 'CodeBuddy 未返回内容，跳过评论。'
            exit 0
          fi
          gh pr comment "$PR_NUMBER" --body-file review.md
