name: CodeBuddy Issue / PR Assistant

# 支持的触发方式：
#   1. 新建 / 重开 Issue：自动 AI 分析并回复
#   2. Issue 或 PR 会话评论里 @codebuddy：按追问回复
#   3. PR 行内评论（单条评论或随 review 一起提交）里 @codebuddy：带 diff 回答
#   4. 手动指定 Issue / PR 编号触发
on:
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  # 兜底：部分仓库/场景下 review 类事件不会派发到 Actions，
  # 因此每 5 分钟扫描一次未获回复的行内 @codebuddy 提问
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      issue_number:
        # 留空则执行下面的兜底作业（扫描并回答未回复的行内 @codebuddy 提问）
        description: 要处理的 Issue / PR 编号（留空=轮询 PR 行内提问）
        required: false

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  ai-assistant:
    # 事件驱动：Issue / 评论；手动触发且填了编号时走这里
    if: >
      github.event_name != 'schedule' && inputs.issue_number != ''
    # 注意：secrets 上下文不可用于 job 级 if，因此密钥判断放在步骤内
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 解析触发来源（是否含 @codebuddy / 是否 PR 场景）
        id: ctx
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          TARGET_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.issue_number }}
          REVIEW_ID: ${{ github.event.review.id }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_PATH: ${{ github.event.comment.path }}
          COMMENT_LINE: ${{ github.event.comment.line || github.event.comment.original_line }}
          # 是否为 PR 场景：PR 行内评论 / PR review / 落在 PR 上的会话评论
          IS_PR_EXPR: ${{ github.event_name == 'pull_request_review_comment' || github.event_name == 'pull_request_review' || github.event.issue.pull_request != null }}
        run: |
          N="$TARGET_NUMBER"
          IS_PR="$IS_PR_EXPR"
          BODY="$COMMENT_BODY"
          PATH_V="$COMMENT_PATH"
          LINE_V="$COMMENT_LINE"
          TRIGGERED="false"

          # 手动触发时若填的是 PR 编号，自动识别为 PR 场景（Issue 与 PR 共用编号空间）
          if [ "$EVENT" = "workflow_dispatch" ] && gh pr view "$N" >/dev/null 2>&1; then
            IS_PR="true"
          fi

          if [ "$EVENT" = "issues" ] || [ "$EVENT" = "workflow_dispatch" ]; then
            TRIGGERED="true"
          elif printf '%s' "$BODY" | grep -q '@codebuddy'; then
            TRIGGERED="true"
          elif [ -n "$REVIEW_ID" ]; then
            # review 提交时，行内评论不在事件正文里，需按 review 拉取
            gh api "repos/$GH_REPO/pulls/$N/reviews/$REVIEW_ID/comments" > rc.json
            HIT=$(jq -c '[.[] | select(.body | test("@codebuddy"))] | last' rc.json)
            if [ -n "$HIT" ] && [ "$HIT" != "null" ]; then
              TRIGGERED="true"
              IS_PR="true"
              BODY=$(printf '%s' "$HIT" | jq -r '.body')
              PATH_V=$(printf '%s' "$HIT" | jq -r '.path')
              LINE_V=$(printf '%s' "$HIT" | jq -r '.line // .original_line')
            fi
          fi

          echo "event=$EVENT, target=#$N, is_pr=$IS_PR, triggered=$TRIGGERED"
          if [ "$TRIGGERED" != "true" ]; then
            echo "评论中未检测到 @codebuddy，跳过。"
          fi

          {
            echo "triggered=$TRIGGERED"
            echo "is_pr=$IS_PR"
            echo "body<<CB_BODY_EOF"
            printf '%s\n' "$BODY"
            echo "CB_BODY_EOF"
            echo "path=$PATH_V"
            echo "line=$LINE_V"
          } >> "$GITHUB_OUTPUT"

      - name: 检查是否启用 AI
        id: enable
        if: steps.ctx.outputs.triggered == 'true'
        env:
          CODEBUDDY_API_KEY: ${{ secrets.CODEBUDDY_API_KEY }}
        run: |
          if [ -n "$CODEBUDDY_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "未配置 CODEBUDDY_API_KEY，跳过 AI 处理。"
          fi

      - uses: actions/checkout@v4
        if: steps.ctx.outputs.triggered == 'true' && steps.enable.outputs.enabled == 'true'

      - uses: actions/setup-node@v4
        if: steps.ctx.outputs.triggered == 'true' && steps.enable.outputs.enabled == 'true'
        with:
          node-version: '20'

      - name: 安装 CodeBuddy CLI
        if: steps.ctx.outputs.triggered == 'true' && steps.enable.outputs.enabled == 'true'
        run: npm install -g @tencent-ai/codebuddy-code

      - name: AI 分析并回复
        if: steps.ctx.outputs.triggered == 'true' && steps.enable.outputs.enabled == 'true'
        env:
          CODEBUDDY_API_KEY: ${{ secrets.CODEBUDDY_API_KEY }}
          CODEBUDDY_INTERNET_ENVIRONMENT: ${{ vars.CODEBUDDY_INTERNET_ENVIRONMENT }}
          CODEBUDDY_RETRY_WATCHDOG: '1'
          CODEBUDDY_CODE_MAX_TURNS: '20'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TARGET_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.issue_number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ steps.ctx.outputs.body }}
          COMMENT_PATH: ${{ steps.ctx.outputs.path }}
          COMMENT_LINE: ${{ steps.ctx.outputs.line }}
          IS_PR: ${{ steps.ctx.outputs.is_pr }}
        run: |
          N="$TARGET_NUMBER"

          if [ "$IS_PR" = "true" ]; then
            # ---- PR 场景：带上 PR 元信息 + diff，复用代码审查提示词 ----
            gh pr view "$N" --json title,body > target.json
            TITLE=$(jq -r '.title' target.json)
            BODY=$(jq -r '.body' target.json)
            gh pr diff "$N" > target.diff

            {
              cat .github/codebuddy/review-prompt.md
              if [ -n "$COMMENT_PATH" ]; then
                printf '\n追加问题（@codebuddy，位于 `%s` 第 %s 行）：\n\n%s\n\n' \
                  "$COMMENT_PATH" "$COMMENT_LINE" "$COMMENT_BODY"
              else
                printf '\n追加问题（@codebuddy）：\n\n%s\n\n' "$COMMENT_BODY"
              fi
              printf '## PR #%s\n\n**标题**：%s\n\n**正文**：\n\n%s\n\ndiff 如下：\n\n' \
                "$N" "$TITLE" "$BODY"
              cat target.diff
            } > full-prompt.md

            INSTRUCTION="请严格按输入中的输出要求审查该 PR，并重点回答其中的“追加问题”，只输出最终答复文本。"
          else
            # ---- Issue 场景 ----
            # 手动触发（workflow_dispatch）时事件里没有 Issue 数据，改用 gh 读取
            if [ -n "$ISSUE_TITLE" ]; then
              TITLE="$ISSUE_TITLE"
              BODY="$ISSUE_BODY"
            else
              gh issue view "$N" --json title,body > target.json
              TITLE=$(jq -r '.title' target.json)
              BODY=$(jq -r '.body' target.json)
            fi

            {
              cat .github/codebuddy/issue-prompt.md
              printf '\n\n---\n\n## Issue #%s\n\n**标题**：%s\n\n**正文**：\n\n%s\n' \
                "$N" "$TITLE" "$BODY"
              if [ -n "$COMMENT_BODY" ]; then
                printf '\n\n**触发评论（@codebuddy）**：\n\n%s\n' "$COMMENT_BODY"
              fi
            } > full-prompt.md

            INSTRUCTION="请严格按输入中的《输出要求》分析该 Issue，只输出最终答复文本。"
          fi

          echo "--- prompt bytes: $(wc -c < full-prompt.md) ---"

          set +e
          cat full-prompt.md | codebuddy -p "$INSTRUCTION" \
            --dangerously-skip-permissions \
            --allowedTools "Read Grep Glob Bash(git:*)" \
            > reply.md 2>reply.err
          EXIT=$?
          set -e

          echo "exit code: $EXIT"
          echo "--- CLI stderr（仅诊断）---"
          sed -r 's/\x1B\[[0-9;]*[mK]//g' reply.err || true
          echo "--- reply.md bytes: $(wc -c < reply.md) ---"

          if [ ! -s reply.md ]; then
            echo "CodeBuddy 未返回内容，请检查密钥与环境配置。"
            exit 1
          fi

          # 带上标记，便于定时任务识别“该提问已被回复”，避免重复回答
          {
            printf '<!-- codebuddy-answer -->\n\n'
            cat reply.md
          } > answer.md

          if [ "$IS_PR" = "true" ]; then
            gh pr comment "$N" --body-file answer.md
          else
            gh issue comment "$N" --body-file answer.md
          fi

  # 兜底作业：定时扫描所有开放 PR 的行内评论，
  # 找出未被回复的 @codebuddy 提问并作答（应对 review 类事件未派发到 Actions 的情况）
  ai-pr-mentions:
    # 定时触发，或手动触发但未填编号时执行
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.issue_number == '')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 检查是否启用 AI
        id: enable
        env:
          CODEBUDDY_API_KEY: ${{ secrets.CODEBUDDY_API_KEY }}
        run: |
          if [ -n "$CODEBUDDY_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "未配置 CODEBUDDY_API_KEY，跳过轮询。"
          fi

      - uses: actions/checkout@v4
        if: steps.enable.outputs.enabled == 'true'

      - uses: actions/setup-node@v4
        if: steps.enable.outputs.enabled == 'true'
        with:
          node-version: '20'

      - name: 安装 CodeBuddy CLI
        if: steps.enable.outputs.enabled == 'true'
        run: npm install -g @tencent-ai/codebuddy-code

      - name: 扫描并回答未回复的 @codebuddy 提问
        if: steps.enable.outputs.enabled == 'true'
        env:
          CODEBUDDY_API_KEY: ${{ secrets.CODEBUDDY_API_KEY }}
          CODEBUDDY_INTERNET_ENVIRONMENT: ${{ vars.CODEBUDDY_INTERNET_ENVIRONMENT }}
          CODEBUDDY_RETRY_WATCHDOG: '1'
          CODEBUDDY_CODE_MAX_TURNS: '20'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          MARK='<!-- codebuddy-answer -->'
          HANDLED=0

          for N in $(gh pr list --state open --json number --jq '.[].number'); do
            gh api --paginate "repos/$GH_REPO/pulls/$N/comments" > "rc_$N.json"
            TIMES=$(jq -r '.[] | select(.body | contains("@codebuddy")) | .created_at' "rc_$N.json")

            if [ -z "$TIMES" ]; then
              echo "PR #$N：无行内 @codebuddy 提问，跳过。"
              continue
            fi

            gh api --paginate "repos/$GH_REPO/issues/$N/comments" > "ic_$N.json"

            # 按时间从早到晚，挑出第一条尚未被回复的提问
            # 判定窗口：该提问与下一条提问之间是否已有带标记的机器人回复
            SELECTED=""
            IDX=0
            while read -r T; do
              if [ -z "$T" ]; then continue; fi
              IDX=$((IDX+1))
              NEXT_T=$(printf '%s\n' "$TIMES" | sed -n "$((IDX+1))p")
              if [ -z "$NEXT_T" ]; then NEXT_T="9999-12-31T00:00:00Z"; fi
              ANSWERED=$(jq -r --arg t "$T" --arg nt "$NEXT_T" --arg m "$MARK" \
                '[.[] | select(.created_at > $t and .created_at < $nt) | select(.user.login == "github-actions[bot]") | select(.body | contains($m))] | length' \
                "ic_$N.json")
              if [ "$ANSWERED" = "0" ]; then
                SELECTED="$T"
                break
              fi
            done <<< "$TIMES"

            if [ -z "$SELECTED" ]; then
              echo "PR #$N：所有 @codebuddy 提问均已回复，跳过。"
              continue
            fi

            HIT=$(jq -c --arg t "$SELECTED" \
              '[.[] | select(.body | contains("@codebuddy")) | select(.created_at == $t)] | last' "rc_$N.json")
            QBODY=$(printf '%s' "$HIT" | jq -r '.body')
            QPATH=$(printf '%s' "$HIT" | jq -r '.path')
            QLINE=$(printf '%s' "$HIT" | jq -r '.line // .original_line')

            echo "PR #$N：发现未回复的 @codebuddy 提问（$QPATH:$QLINE @ $SELECTED），开始作答。"
            gh pr view "$N" --json title,body > pr_meta.json
            TITLE=$(jq -r '.title' pr_meta.json)
            BODY=$(jq -r '.body' pr_meta.json)
            gh pr diff "$N" > target.diff

            {
              cat .github/codebuddy/review-prompt.md
              printf '\n追加问题（@codebuddy，位于 `%s` 第 %s 行）：\n\n%s\n\n' \
                "$QPATH" "$QLINE" "$QBODY"
              printf '## PR #%s\n\n**标题**：%s\n\n**正文**：\n\n%s\n\ndiff 如下：\n\n' \
                "$N" "$TITLE" "$BODY"
              cat target.diff
            } > full-prompt.md

            set +e
            cat full-prompt.md | codebuddy -p \
              "请严格按输入中的输出要求审查该 PR，并重点回答其中的“追加问题”，只输出最终答复文本。" \
              --dangerously-skip-permissions \
              --allowedTools "Read Grep Glob Bash(git:*)" \
              > reply.md 2>reply.err
            EXIT=$?
            set -e

            echo "exit code: $EXIT"
            sed -r 's/\x1B\[[0-9;]*[mK]//g' reply.err || true
            echo "--- reply.md bytes: $(wc -c < reply.md) ---"

            if [ ! -s reply.md ]; then
              echo "CodeBuddy 未返回内容，保留提问待下次轮询。"
              continue
            fi

            {
              printf '%s\n\n' "$MARK"
              cat reply.md
            } > answer.md

            gh pr comment "$N" --body-file answer.md
            echo "PR #$N：已回复。"
            HANDLED=1
            # 每次轮询只处理一个提问，避免超出作业时限
            break
          done

          echo "本次轮询处理数量：$HANDLED"
